[package]
name = "kamux"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kamux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
memchr = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
mac-usernotifications = "0.3"

[dev-dependencies]
tempfile = "3"
# "unstable" は Manager::get_window（テストのみで使用: WebviewWindow から
# 素の Window<R> を引き直すため）に必要。dev-dependencies なので production
# の `cargo build` / `cargo build --release` には影響しない。
tauri = { version = "2", features = ["test", "unstable"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "test-util"] }

[[test]]
# 契約 §29.8: `harness = false` の `fn main()` は libtest のワーカースレッドを
# 経由せずプロセスの実の main thread で走る。muda 0.19.3 のメニュー構築 API は
# 実の main thread を要求するため（`src-tauri/src/lib.rs` の `build_app_menu`
# doc コメント参照）、通常の `#[test]` からは呼べない。
name = "menu_no_close_window"
path = "tests/menu_no_close_window.rs"
harness = false
