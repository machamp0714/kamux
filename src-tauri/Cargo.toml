[package]
name = "kamux"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kamux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
mac-usernotifications = "0.3"
log = "0.4"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", features = ["CFRunLoop"] }

[dev-dependencies]
tempfile = "3"
# "unstable" は Manager::get_window（テストのみで使用: WebviewWindow から
# 素の Window<R> を引き直すため）に必要。dev-dependencies なので production
# の `cargo build` / `cargo build --release` には影響しない。
tauri = { version = "2", features = ["test", "unstable"] }
