[package]
name = "kamux"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "kamux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# "unstable" は Manager::get_window（テストのみで使用: WebviewWindow から
# 素の Window<R> を引き直すため）に必要。dev-dependencies なので production
# の `cargo build` / `cargo build --release` には影響しない。
tauri = { version = "2", features = ["test", "unstable"] }
# hooks_srv::payload のテストで tracing::warn! が実際に鳴ったことを検証するために
# 使う（`Registry` + 自前 `Layer` でイベントをキャプチャする）。dev-dependencies
# なので production の `cargo build` / `cargo build --release` には影響しない。
tracing-subscriber = "0.3"
