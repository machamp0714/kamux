name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # 契約 §0 の MSRV。stable ではなく 1.90 で検査する
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # ワークスペースルートはリポジトリルート（`Cargo.toml` / `Cargo.lock` /
          # `target/` が repo root にある）。`run:` の working-directory は
          # 引き続き src-tauri だが、cargo 自体は親をたどって repo root の
          # ワークスペースを解決するため、キャッシュ対象だけをここで repo root に
          # 合わせる。
          workspaces: .
      # tauri.conf.json の externalBin が bin/kamux-relay-{target-triple} の実在を
      # 要求するため、src-tauri 配下のあらゆる cargo 呼び出し（fmt/clippy/test の
      # build script 実行）より先に relay バイナリを配置しておく必要がある。
      # cargo test --workspace は debug ビルドを前提にするため、ここも debug
      # （引数なし）で揃える。
      - run: ../scripts/build-relay.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
